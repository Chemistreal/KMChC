# 엔진(채점·리포트)이 네 HTML 파일에 동일하게 유지되는지 자동 검사.
# 하나만 고치고 나머지를 빠뜨리면 이 검사가 실패해서 빨간불이 뜬다.
# 앱스크립트(.gs)의 읽기 창구도 여기서 함께 본다 — 통합 셸이 그걸 부른다.
name: 엔진 동기화 검사

on:
  # 예전에는 '이 파일들이 바뀌면 돈다' 는 목록이었다. 그런데 목록에 없는 파일이
  # 생기면 그 파일은 **아무 검사도 안 받고 지나간다.** 실제로 tools/ 를 고친
  # PR 이 검사 없이 초록불이었다(exam 저장소에서도 같은 일이 있었다).
  # 뒤집는다: 기본은 '돈다', 검사와 상관없는 것만 뺀다.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  # 아무도 안 밀어도 하루 한 번 돈다. exam 저장소에서 자동 커밋이 데이터를
  # 지우고 main 이 네 시간 동안 빨간 채로 있었다 — 아무도 안 밀었기 때문이다.
  schedule:
    - cron: '29 21 * * *'     # 매일 06:29 KST
  workflow_dispatch:

# 한 브랜치에서 앞 검사가 끝나기도 전에 다음 커밋이 오면, 앞 것은 이미 낡은
# 답이다. 그런데 끝까지 돌아 실패하면 **메일은 그대로 간다.** 취소된 검사는
# 메일을 안 보낸다 — 낡은 답을 지우면 그만큼 조용해지고 시간도 아낀다.
# main 에서는 안 지운다. 거기서 취소하면 어느 커밋도 검사받지 않은 채 남는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  engine-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 브라우저는 바깥 stylesheet 를 만나면 **그리기를 멈추고 기다린다.**
      # 구글 글꼴이 늦거나 안 닿으면 화면은 '글꼴만 못생긴 상태' 가 아니라
      # 아무것도 없는 흰 종이다. exam 에서 재어 보니 첫 그림이 13.2초였다.
      # 여기 7장 전부가 같은 모양이었다 — 학부모가 여는 report.html 도 그중 하나다.
      # ⚠ 이 판은 2026-08-10 에 열어 보니 **여섯 번 가운데 여섯 번이 빨간불**
      #   이었고 아무도 안 보고 있었다. 까닭은 자가 틀려서가 아니라 **자가 여기서
      #   돌 수 없어서**였다 — crop_align 의 `import fitz` 를 설치하는 줄이 없었다.
      #   즉 크롭 밀림도 문제지 답 유출도 CI 는 한 번도 막은 적이 없다.
      #   "재는 것과 막는 것은 다르다" 의 한 칸 앞 — **돌 수 있는 것과 걸어 둔 것은
      #   다르다.** 이 자를 맨 앞에 둬서 그것부터 본다.
      - name: CI 가 부르는 자가 여기서 돌 수 있다
        timeout-minutes: 5
        run: python3 tools/ci_deps.py --check
      - name: 바깥 글꼴이 첫 화면을 막지 않는다
        run: python3 tools/font_block.py --check
      # 성적표 링크는 암호를 묻지 않는다. 그러면 남는 보호막은 주소를 남이
      # 모른다는 것 하나뿐이라, 검색에 잡히면 보호막이 통째로 사라진다.
      - name: 개인 성적 화면이 검색에 열려 있지 않다
        run: python3 tools/noindex.py --check
      # 브라우저에 무엇을 남기는지 여태 아무 데도 안 적혀 있었다. 재어 보니
      # 세 칸이고 셋 다 지워도 남의 기록이 안 깨지는 것들이다 — 그 성질을
      # 지킨다. 새 칸이 생기면 "이건 앱 자료가 아니라 이 브라우저의 취향인가"
      # 를 한 번 묻게 하고, 성적·명단으로 보이는 이름은 그 자리에서 막는다.
      - name: 브라우저에 남기는 칸이 적어 둔 것뿐이다
        run: python3 tools/store_ledger.py --check
      # 아무 데서도 안 걸리는 화면은 주소를 아는 사람만 열 수 있다. 이런 장은
      # 늘어날 때가 아니라 **지울 때** 생긴다 — 걸던 화면을 지우면 걸리던
      # 장이 그날부터 문이 없다. 지금 0장이고, 0장인 채로 둔다.
      - name: 모든 화면에 문이 있다
        run: python3 tools/page_doors.py --check
      # 이 저장소의 audit_pages 는 아무것도 안 막고 있었다. 잘못 재는 자는
      # 안 재느니만 못하다. 자마다 참·거짓 예시를 붙여 두고 매번 맞히게 한다.
      - name: 자가 참·거짓 예시를 맞힌다
        run: python3 tools/lie_check.py --check
      # 네 앱이 다 GitHub Pages 로 나가는데 **거기에 한도가 있다는 것을 아무도
      # 안 재고 있었다**(사이트 1GB · 파일 하나 100MB). 이 한도는 벽에 닿아야
      # 알게 된다 — 어느 날 배포가 멈추고, 그때서야 무엇이 무거운지 찾는다.
      # 그래서 벽이 아니라 **문턱(700MB)** 에서 켠다. 급하면 지우면 안 될 것을
      # 지우게 되므로, 고를 시간이 남아 있을 때 알린다.
      - name: 배포 한도에 여유가 있다
        run: python3 tools/pages_budget.py --check
      # 성적표 링크는 문자로 나가 **휴대폰에서 열린다.** 지금 7장 모두 성하고,
      # 0장인 채로 두려고 건다 — exam 은 처음 재자마자 258장 중 16장이 걸렸다.
      # ── 브라우저 ──────────────────────────────────────────
      # ⚠ 여기에는 브라우저가 **없었다.** 그런데 2026-08-10 에 브라우저가 필요한
      #   검사를 REQUIRE_BROWSER 를 켠 채 걸어 버려서, 그날부터 판마다 빨간불이
      #   났다("실패: playwright 를 찾지 못했다"). 재는 자를 들이면서 그 자가
      #   돌 자리를 안 만든 것이다 — 만들어 놓고 못 돌리면 없는 것과 같다.
      - name: playwright 설치
        timeout-minutes: 5
        run: npm install --prefix tests
      - name: chromium 설치
        timeout-minutes: 10
        run: npx --prefix tests playwright install --with-deps chromium
      # ⚠ 이 단계는 **playwright 설치보다 앞**에 있었다(2026-08-10 에 찾음).
      #   그러면 자가 '건너뜀' 으로 조용히 0 을 내고 지나간다 — 그림 위 글씨를
      #   여태 아무도 안 재고 있었다는 뜻이다. 건너뛴 것은 초록으로 세지 않는다.
      - name: 그림 위에서도 글씨가 읽힌다 (실제 브라우저)
        run: NODE_PATH=tests/node_modules REQUIRE_BROWSER=1 node tests/theme.js
      - name: 휴대폰 폭에서 화면이 옆으로 밀리지 않는다
        env:
          REQUIRE_BROWSER: '1'
        run: NODE_PATH=tests/node_modules node tests/narrow.js
      # font_block.py 는 **CSS 규칙만 읽는다.** 규칙이 맞아도 실제로 몇 초에
      # 뜨는지는 안 본다 — 네 앱 어디서도 안 재던 값이다. 여기서는 3G 로 조이고
      # 글꼴 창구를 침묵시킨 뒤 첫 그림이 실제로 생기는지 잰다.
      # 성적표 링크는 문자로 나가므로 학원 와이파이 하나만 걸려도 학부모가 빈
      # 화면을 본다. 빠르기만 재면 '글꼴을 빼는 것' 이 만점이라 **오는지**도 잰다.
      - name: 글꼴이 안 와도 첫 그림이 뜬다
        env:
          REQUIRE_BROWSER: '1'
        run: NODE_PATH=tests/node_modules node tests/first-paint.js
      # 성적표는 **앱스크립트 창구**에서 자료를 받아 그린다. 그 창구는 구글
      # 쪽이라 우리가 못 고치는 이유로 죽는다 — 배포 중·할당량·학원 망.
      # 그때 학부모가 무엇을 보는지 여태 아무도 안 쟀다. 빈 흰 종이가 되는 것과
      # **죽은 줄 모르고 아무 말도 안 하는 것** 둘 다 잡는다. 죽는 방식은
      # 끊김·침묵·오류 셋으로 본다 — 침묵은 화면이 영영 기다릴 수 있다.
      - name: 창구가 죽어도 화면이 뜨고 사정을 말한다
        env:
          REQUIRE_BROWSER: '1'
        run: NODE_PATH=tests/node_modules node tests/gate-down.js
      # 이 저장소에는 학생 이름을 **맞춰 보는 자리가 없다.** exam·DT 는 공백을
      # 모두 지워 맞춰 보는데 여기는 안 본다 — 한 아이가 두 사람이 되어도 모른다.
      # 고치는 것은 자료를 옮기는 일이라 선생님이 정할 칸이고, 그때까지 조용하다.
      - name: 학생 이름을 맞춰 보는 규칙이 정한 대로다
        run: python3 tools/name_key.py --check
      # ⚠ 이 자는 저장소에 **넣어 놓고 아무 데도 안 걸어 두었다**(2026-08-10).
      #   파일만 있고 CI 도 README 도 안 부르니 없는 것과 같았다 — 이 저장소가
      #   가장 경계하는 "재기만 하고 안 막는" 꼴을 자를 들이면서 다시 만든 셈이다.
      #   흰 종이에 흰 글씨가 되는 자리는 지금 0장이지만 인쇄 규칙이 5장에 있다.
      - name: 종이에서 글자가 사라지지 않는다
        run: python3 tools/print_ink.py --check
      # 화면이 사람에게 하는 말 4,404개. 그중 400개가 평가 문장이다 —
      # '개념의 토대가 비교적 단단히 잡혀 있습니다' 같은, 아이가 자기를 보는
      # 방식을 만드는 말이다. 고치지 않고 **줄어드는 것만** 막는다.
      - name: 사람에게 하는 말이 조용히 사라지지 않았다
        run: python3 tools/msg_ledger.py --check --quiet

<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7A6E"/><stop offset=".62" stop-color="#0A5C53"/><stop offset="1" stop-color="#2A5470"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#3c301c" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#F4EFE6"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- 좌측 원소 타일 -->
  <g transform="translate(80,135)">
    <rect width="360" height="360" rx="34" fill="url(#tile)"/>
    <circle cx="300" cy="60" r="150" fill="url(#glow)"/>
    <text x="34" y="58" font-family="'IBM Plex Sans KR',sans-serif" font-size="17" letter-spacing="3" fill="#ffffff" opacity="0.85" font-weight="600">CHEMISTRY LEARNER TYPE</text>
    <text x="34" y="205" font-family="Georgia,'Times New Roman',serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-1">속·분</text>
    <text x="34" y="285" font-family="Georgia,'Times New Roman',serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-1">탐·도</text>
    <text x="34" y="338" font-family="'IBM Plex Sans KR',sans-serif" font-size="24" fill="#ffffff" opacity="0.95" font-weight="600">구조 탐험가</text>
  </g>

  <!-- 우측 텍스트 -->
  <g transform="translate(500,150)">
    <g>
      <rect x="0" y="0" width="300" height="40" rx="20" fill="#ffffff" stroke="#D6CAB3"/>
      <circle cx="24" cy="20" r="5" fill="#0E7A6E"/>
      <text x="42" y="26" font-family="'IBM Plex Sans KR',sans-serif" font-size="16" fill="#0A5C53" font-weight="600" letter-spacing="1">화학 학습유형 · 오개념 정밀진단</text>
    </g>
    <text x="0" y="120" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="800" fill="#1C1812" letter-spacing="-1">우리 아이는 어떤</text>
    <text x="0" y="196" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="800" letter-spacing="-1">
      <tspan fill="#0E7A6E">화학 두뇌</tspan><tspan fill="#1C1812">일까?</tspan>
    </text>
    <text x="0" y="258" font-family="'IBM Plex Sans KR',sans-serif" font-size="22" fill="#403A30">점수가 아니라 성향과 직관을 봅니다.</text>

    <!-- 칩 -->
    <g font-family="'IBM Plex Sans KR',sans-serif" font-size="18" font-weight="600">
      <g transform="translate(0,300)"><rect width="150" height="48" rx="24" fill="#ffffff" stroke="#D6CAB3"/><text x="75" y="31" text-anchor="middle" fill="#0A5C53">100문항</text></g>
      <g transform="translate(166,300)"><rect width="150" height="48" rx="24" fill="#ffffff" stroke="#D6CAB3"/><text x="75" y="31" text-anchor="middle" fill="#0A5C53">16가지 유형</text></g>
      <g transform="translate(332,300)"><rect width="200" height="48" rx="24" fill="#ffffff" stroke="#D6CAB3"/><text x="100" y="31" text-anchor="middle" fill="#0A5C53">검증 연구 기반</text></g>
    </g>
  </g>

  <text x="80" y="566" font-family="'IBM Plex Sans KR',sans-serif" font-size="18" fill="#857B6B">조준모 · 다원교육</text>
</svg>

.muted{color:var(--muted);font-size:12px}.note{color:var(--muted);font-size:11px;margin-top:24px;font-style:italic}</style></head><body><div class="wrap"><h1>화학 진단 v2 · 검증 대시보드</h1><p class="muted">시트(결과 탭)를 CSV로 내보내 올리거나 붙여넣으세요. 데모 행은 자동 제외됩니다.</p><div class="drop"><input type="file" id="file" accept=".csv,text/csv"><div class="muted" style="margin-top:6px">또는 CSV 붙여넣기 ↓</div><textarea id="paste" placeholder="시각,이름,학년,구분,...,응답원본"></textarea><div style="margin-top:8px"><button class="btn" id="runBtn">분석</button></div></div><div id="out"></div><p class="note">문항-총점·맥락 분리·사다리 단조는 ‘설계 가설’ 검정입니다. 100명 이상에서 확정/기각하세요.</p></div><script>"use strict";
/* ===== 화학 진단 v2 — 검증 분석 =====
 * data = [{ans:{문항응답}}...] (수집 응답), ITEMS = 통합 문항
 * (1) itemTotalReport : 보정 문항-총점 상관 + 천장률 → 변별
 * (2) contextSeparation : 맥락 간 상관행렬 + 개인내 분산 → 맥락 분리
 * (3) ladderMonotonicity : Guttman 재현계수 + 단계별 동의율 → 사다리 단조성
 */

function avg(a) { var b = a.filter(function (x) { return x != null; }); return b.length ? b.reduce(function (s, x) { return s + x; }, 0) / b.length : null; }
function sd(a) { var b = a.filter(function (x) { return x != null; }); if (b.length < 2) return null; var m = avg(b); return Math.sqrt(b.reduce(function (s, x) { return s + (x - m) * (x - m); }, 0) / (b.length - 1)); }
function corr(xs, ys) {
  var X = [], Y = [];
  for (var i = 0; i < xs.length; i++) if (xs[i] != null && ys[i] != null) { X.push(xs[i]); Y.push(ys[i]); }
  if (X.length < 3) return null;
  var mx = avg(X), my = avg(Y), num = 0, dx = 0, dy = 0;
  for (var k = 0; k < X.length; k++) { var a = X[k] - mx, b = Y[k] - my; num += a * b; dx += a * a; dy += b * b; }
  if (dx === 0 || dy === 0) return null;
  return num / Math.sqrt(dx * dy);
}
function r2(x) { return x == null ? null : Math.round(x * 100) / 100; }
// 역문항 반영 raw → latent (1..5)
function latent(it, ans) { var v = ans[it.id]; if (typeof v !== "number") return null; return it.rev ? (6 - v) : v; }

/* (1) 보정 문항-총점 상관 + 천장률 (구인별) */
function itemTotalReport(data, ITEMS) {
  var cons = {};
  ITEMS.forEach(function (it) {
    if (["ladder", "context", "general", "relative", "internalize"].indexOf(it.kind) < 0) return;
    (cons[it.con] = cons[it.con] || []).push(it);
  });
  var out = {};
  Object.keys(cons).forEach(function (con) {
    var its = cons[con];
    // 각 응답자의 문항별 latent
    var mat = data.map(function (d) { return its.map(function (it) { return latent(it, d.ans); }); });
    var rows = its.map(function (it, ci) {
      var self = mat.map(function (m) { return m[ci]; });
      var rest = mat.map(function (m) { var s = 0, n = 0; m.forEach(function (v, j) { if (j !== ci && v != null) { s += v; n++; } }); return n ? s : null; });
      var raw = data.map(function (d) { return typeof d.ans[it.id] === "number" ? d.ans[it.id] : null; });
      var ceiling = (function () { var b = raw.filter(function (v) { return v != null; }); return b.length ? Math.round(b.filter(function (v) { return v >= 4; }).length / b.length * 100) : null; })();
      return { id: it.id, kind: it.kind, r: r2(corr(self, rest)), sd: r2(sd(self)), ceiling: ceiling, weak: (function () { var c = corr(self, rest); return c != null && c < 0.2; })() };
    });
    out[con] = rows;
  });
  return out;
}

/* (2) 맥락 분리 (interest / anxiety) */
function contextSeparation(data, ITEMS, con) {
  var CTX = ["phenom", "symbol", "quant", "lab"];
  var items = {};
  CTX.forEach(function (c) { items[c] = ITEMS.filter(function (it) { return it.con === con && it.kind === "context" && it.ctx === c; })[0]; });
  var series = {};
  CTX.forEach(function (c) { series[c] = data.map(function (d) { return items[c] ? latent(items[c], d.ans) : null; }); });
  var M = {}, off = [];
  CTX.forEach(function (a) { M[a] = {}; CTX.forEach(function (b) { var rr = (a === b) ? 1 : corr(series[a], series[b]); M[a][b] = r2(rr); if (a < b && rr != null) off.push(rr); }); });
  // 개인내 분산(맥락 간 표준편차의 평균)
  var within = data.map(function (d) { return sd(CTX.map(function (c) { return items[c] ? latent(items[c], d.ans) : null; })); });
  return { matrix: M, meanOffDiag: r2(avg(off)), withinPersonSD: r2(avg(within)),
    verdict: (avg(off) != null && avg(off) < 0.7) ? "분리됨(맥락 고유 신호)" : "미분리(전역 1요인 의심)" };
}

/* (3) 사다리 단조성 (Guttman) */
function ladderMonotonicity(data, ITEMS, con) {
  var its = ITEMS.filter(function (it) { return it.con === con && it.kind === "ladder"; }).sort(function (a, b) { return a.tier - b.tier; });
  var T = its.length;
  var endorseRate = its.map(function (it) {
    var v = data.map(function (d) { return typeof d.ans[it.id] === "number" ? (d.ans[it.id] >= 4 ? 1 : 0) : null; }).filter(function (x) { return x != null; });
    return { tier: it.tier, rate: v.length ? Math.round(avg(v) * 100) : null };
  });
  // Guttman 위반: 하위 미동의인데 상위 동의 (쌍 단위)
  var pairs = 0, violations = 0, used = 0;
  data.forEach(function (d) {
    var e = its.map(function (it) { return typeof d.ans[it.id] === "number" ? (d.ans[it.id] >= 4 ? 1 : 0) : null; });
    if (e.some(function (x) { return x == null; })) return;
    used++;
    for (var i = 0; i < T; i++) for (var j = i + 1; j < T; j++) { pairs++; if (e[i] === 0 && e[j] === 1) violations++; }
  });
  var reproducibility = pairs ? r2(1 - violations / pairs) : null;
  return { endorseRate: endorseRate, n: used, violationRate: pairs ? r2(violations / pairs) : null, reproducibility: reproducibility,
    verdict: (reproducibility != null && reproducibility >= 0.85) ? "단조 양호(사다리 성립)" : "단조 약함(문턱 재배치 필요)" };
}

if (typeof module !== "undefined") module.exports = { itemTotalReport: itemTotalReport, contextSeparation: contextSeparation, ladderMonotonicity: ladderMonotonicity, corr: corr };

,"표시해 뒀다가 나중에 찾는다","선생님이나 친구에게 묻는다"],"optcode":["skip","seek_now","seek_later","ask"],"text":"(시나리오) 미지어 대처","note":"정보 추구 전략 패턴"},{"id":"V-SD1","block":"V","con":"validity","kind":"sd","tier":null,"ctx":null,"rev":false,"text":"나는 모르는 화학 내용을 아는 척해 본 적이 한 번도 없다.","note":"사회적 바람직성 — '한 번도'에 강한 동의=과대 가능"},{"id":"V-SD2","block":"V","con":"validity","kind":"sd","tier":null,"ctx":null,"rev":false,"text":"수업 시간에 한 번도 딴생각을 해본 적이 없다.","note":"사회적 바람직성"},{"id":"V-OC","block":"V","con":"validity","kind":"overclaim","tier":null,"ctx":null,"rev":false,"stem":"다음 중 ‘들어본 적 있는’ 화학 용어에 모두 표시하세요.","terms":[{"t":"증발","real":true},{"t":"용해","real":true},{"t":"연소","real":true},{"t":"응결","real":true},{"t":"역응결 분해","real":false},{"t":"단일가 환원수","real":false}],"text":"(과대주장) 용어 친숙도","note":"가짜 용어(real:false) 체크 수 = 과대주장 지표. 진짜 용어는 채점 안 함(미학습 무관)."},{"id":"V-CS1a","block":"V","con":"validity","kind":"consistency","tier":null,"ctx":null,"rev":false,"pair":"V-CS1","pole":"pos","text":"화학 공부는 나에게 즐거운 편이다.","note":"일관성 쌍1(긍)"},{"id":"V-CS1b","block":"V","con":"validity","kind":"consistency","tier":null,"ctx":null,"rev":true,"pair":"V-CS1","pole":"neg","text":"화학 공부는 나에게 따분한 편이다.","note":"일관성 쌍1(부)"},{"id":"V-CS2a","block":"V","con":"validity","kind":"consistency","tier":null,"ctx":null,"rev":false,"pair":"V-CS2","pole":"pos","text":"나는 공부할 때 미리 계획을 세우는 편이다.","note":"일관성 쌍2(긍)"},{"id":"V-CS2b","block":"V","con":"validity","kind":"consistency","tier":null,"ctx":null,"rev":true,"pair":"V-CS2","pole":"neg","text":"나는 공부할 때 계획 없이 닥치는 대로 하는 편이다.","note":"일관성 쌍2(부)"},{"id":"V-AT","block":"V","con":"validity","kind":"attention","tier":null,"ctx":null,"rev":false,"text":"이 문항은 집중 확인용입니다. ‘보통’을 선택해 주세요.","answer":3,"note":"지시 응답 — 오답이면 부주의"},{"id":"B21","sec":"S2","block":"B","axis":"lens","q":"어떤 실험 결과를 보면, 나는…","o":[{"t":"왜 그런 결과가 나왔는지 원리부터 따져 본다","p":"S"},{"t":"결과로 나타난 변화 자체를 자세히 들여다본다","p":"G"}]},{"id":"B22","sec":"S2","block":"B","axis":"lens","q":"물질이 변하는 걸 관찰할 때, 나는…","o":[{"t":"겉으로 드러나는 변화에 먼저 주목   var $=function(s){return document.querySelector(s);};
  function decodeAns(b){ try{ return JSON.parse(decodeURIComponent(escape(atob(b)))); }catch(e){ return null; } }
  function parseCSV(t){ var rows=[],row=[],cur="",q=false; for(var i=0;i<t.length;i++){ var ch=t[i]; if(q){ if(ch===String.fromCharCode(34)){ if(t[i+1]===String.fromCharCode(34)){cur+=String.fromCharCode(34);i++;} else q=false; } else cur+=ch; } else { if(ch===String.fromCharCode(34))q=true; else if(ch===","){row.push(cur);cur="";} else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&t[i+1]==="\n")i++; row.push(cur);cur="";rows.push(row);row=[]; } else cur+=ch; } } if(cur.length||row.length){row.push(cur);rows.push(row);} return rows.filter(function(r){return r.length>1||(r[0]&&r[0].trim());}); }
  function run(text){ var rows=parseCSV(text); if(rows.length<2){ $("#out").innerHTML="<p class=muted>데이터가 없습니다.</p>"; return; } var head=rows[0], idx={}; head.forEach(function(h,i){idx[h.trim()]=i;}); var rawC=idx["응답원본"]; if(rawC==null){ $("#out").innerHTML="<p class=bad>‘응답원본’ 열을 찾지 못했습니다. v2 시트인지 확인하세요.</p>"; return; } var kindC=idx["구분"], trustC=idx["신뢰도"]; var real=[],demoN=0,bad=0,carelessN=0; for(var i=1;i<rows.length;i++){ var r=rows[i]; if(!r||r[rawC]==null)continue; if(kindC!=null&&(r[kindC]||"").trim()==="데모"){demoN++;continue;} if(trustC!=null&&(r[trustC]||"").trim()==="신중 해석"){carelessN++;continue;} var a=decodeAns((r[rawC]||"").trim()); if(a)real.push({ans:a}); else bad++; } render(real,demoN,bad,carelessN); }
  function verdictPill(v){ var ok=/양호|분리됨/.test(v); return "<span class=\"pill "+(ok?"ok":"warn")+"\">"+v+"</span>"; }
  function render(data,demoN,bad,carelessN){ if(!data.length){ $("#out").innerHTML="<p class=bad>해독 가능한 응답이 없습니다.</p>"; return; } var H="";
    H+="<div class=card><h3>개요</h3><p>분석 대상 <b>"+data.length+"</b>명 · 데모 제외 "+demoN+"건 · 신중 해석 제외 "+(carelessN||0)+"건"+(bad?(" · 해독 실패 "+bad):"")+"</p><p class=muted>신뢰도 ‘신중 해석’(직선응답·과속·과대신호) 응답은 통계에서 제외했습니다.</p>"+(data.length<100?"<p class=muted>※ N&lt;100 — 결과는 잠정. 100명 이상에서 설계를 확정/기각하세요.</p>":"")+"</div>";
    var LAD={interest:"흥미",efficacy:"효능감",metacog:"메타인지"};
    H+="<div class=card><h3>① 사다리 단조성 (Guttman)</h3><table><tr><th>구인</th><th>1→4단 동의율</th><th>재현계수</th><th>판정</th></tr>";
    Object.keys(LAD).forEach(function(c){ var m=ladderMonotonicity(data,ITEMS,c); H+="<tr><td>"+LAD[c]+"</td><td>"+m.endorseRate.map(function(e){return e.rate;}).join(" &gt; ")+"</td><td>"+m.reproducibility+"</td><td>"+verdictPill(m.verdict)+"</td></tr>"; }); H+="</table><p class=muted>상위 단계 응답자가 하위도 동의하는가. 0.85↑ = 사다리 성립.</p></div>";
    ["interest","anxiety"].forEach(function(con){ var sep=contextSeparation(data,ITEMS,con); var lab={interest:"흥미",anxiety:"불안"}[con]; var CTX=["phenom","symbol","quant","lab"],KC={phenom:"현상",symbol:"기호",quant:"정량",lab:"실험"}; var mh="<table><tr><th></th>"+CTX.map(function(c){return "<th>"+KC[c]+"</th>";}).join("")+"</tr>"; CTX.forEach(function(a){ mh+="<tr><td>"+KC[a]+"</td>"+CTX.map(function(b){return "<td>"+(sep.matrix[a][b]==null?"—":sep.matrix[a][b])+"</td>";}).join("")+"</tr>"; }); mh+="</table>"; H+="<div class=card><h3>② 맥락 분리 — "+lab+"</h3>"+mh+"<p>평균 off-diagonal <b>"+sep.meanOffDiag+"</b> · 개인내 SD "+sep.withinPersonSD+" "+verdictPill(sep.verdict)+"</p><p class=muted>낮을수록 맥락이 서로 다른 신호(분리). 0.7↑면 전역 1요인 의심.</p></div>"; });
    var IT=itemTotalReport(data,ITEMS); var CN={interest:"흥미",efficacy:"효능감",metacog:"메타인지",anxiety:"불안",value:"가치"}; H+="<div class=card><h3>③ 문항-총점 상관 (변별)</h3>"; Object.keys(CN).forEach(function(con){ var rows=IT[con]||[]; if(!rows.length)return; var rs=rows.map(function(x){return x.r;}).filter(function(x){return x!=null;}); var mr=rs.length?Math.round(rs.reduce(function(a,b){return a+b;},0)/rs.length*100)/100:null; var weak=rows.filter(function(x){return x.weak;}).length; H+="<p style=\"margin:10px 0 4px\"><b>"+CN[con]+"</b> · 평균 r "+mr+" · 약한 문항 "+weak+"/"+rows.length+"</p><table><tr><th>문항</th><th>r</th><th>SD</th><th>천장%</th></tr>"+rows.map(function(x){return "<tr><td>"+x.id+(x.weak?" ⚠":"")+"</td><td>"+(x.r==null?"—":x.r)+"</td><td>"+(x.sd==null?"—":x.sd)+"</td><td>"+(x.ceiling==null?"—":x.ceiling)+"</td></tr>";}).join("")+"</table>"; }); H+="<p class=muted>r&lt;0.2(⚠)는 변별 약함. 천장%가 낮으면 분산 확보(좋음).</p></div>";
    $("#out").innerHTML=H; }

<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>학부모 리포트 링크 생성기</title>
<link rel="preconnect" href="https://fonts.gstatic.com"><link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4EFE6;--paper-2:#FBF8F1;--ink:#1C1812;--ink-2:#403A30;--teal:#0E7A6E;--teal-d:#0A5C53;--line:#E6DECF;--line-2:#d9cfba;--muted:#8a8378}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 80% at 50% -10%,#fbf8f1,#f1ead d 60%,#efe7d6);color:var(--ink);font-family:'Nanum Gothic',sans-serif;padding:26px 16px 64px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:22px;margin:.1em 0}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.6}
.bar{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
label{font-size:12px;font-weight:800;color:var(--teal-d)}
.base{width:100%;font-size:13px;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;margin-top:6px;font-family:inherit}
table{width:100%;border-collapse:collapse;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{background:rgba(14,122,110,.09);font-size:12px;color:var(--teal-d);padding:10px;text-align:left}
td{border-top:1px solid var(--line);padding:8px 10px;font-size:13px;vertical-align:middle}
.ce{text-align:center}.nm{font-weight:800}
.badge{font-family:ui-monospace,monospace;font-size:11px;background:var(--ink);color:#fff;padding:2px 7px;border-radius:6px}
.lk{width:100%;font-family:ui-monospace,monospace;font-size:11px;padding:6px 8px;border:1px solid var(--line-2);border-radius:6px;background:#fff;color:var(--ink-2)}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--teal);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:800}
.btn.ghost{background:#fff;color:var(--teal-d);border:1px solid var(--line-2)}
.mini{font-size:11px;padding:5px 10px;border-radius:6px;border:none;background:var(--teal-d);color:#fff;font-weight:700}
.mini.ghost{background:#fff;color:var(--teal-d);border:1px solid var(--line-2)}
textarea{width:100%;height:96px;font-size:11px;font-family:ui-monospace,monospace;border:1px solid var(--line-2);border-radius:8px;padding:9px;margin-top:7px}
.msg{color:var(--teal-d);font-size:12.5px;min-height:1.1em;font-weight:700}
.note{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.5}
.row{display:flex;gap:10px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
</style></head>
<body><div class="wrap">
<h1>학부모 리포트 링크 생성기</h1>
<div class="sub">학생별 <b>화학 학습 진단 리포트</b> 링크를 만들어 학부모님께 카카오톡·문자·메일로 그대로 보낼 수 있습니다. 링크를 받은 학부모님은 로그인 없이 전체 해설을 보고, 트랙 이름을 눌러 설명을 펼칠 수 있습니다.</div>
<div class="bar">
  <label>리포트가 올라간 주소(폴더)</label>
  <input id="baseUrl" class="base" placeholder="https://아이디.github.io/저장소/">
  <div class="note" id="baseNote"></div>
</div>
<div class="row">
  <b id="cnt" style="font-size:15px">0명</b>
  <button class="btn" id="copyAll" type="button">전체 링크 복사 (이름 + 링크)</button>
  <span class="msg" id="msg"></span>
</div>
<table><thead><tr><th>이름</th><th class="ce">학년</th><th class="ce">유형</th><th>학부모 전송용 링크</th><th class="ce">동작</th></tr></thead><tbody id="tbody"></tbody></table>
<div class="bar" style="margin-top:20px">
  <label>다른 학생 추가 — 구글 시트에서 행을 복사해 붙여넣으세요</label>
  <textarea id="paste" placeholder="구글 시트의 학생 행을 그대로 복사 → 여기에 붙여넣기 (맨 끝 응답원본 칸까지 포함). ID 열이 있으면 이름 없는 짧은 ?id= 링크로 만들어집니다. 헤더 줄이 있어도 자동으로 건너뜁니다."></textarea>
  <button class="btn" id="parseBtn" type="button" style="margin-top:8px">붙여넣은 데이터로 링크 생성</button>
  <div class="note">붙여넣고 누르면 위 표가 교체됩니다.</div>
</div>
</div>

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function folder(){return location.href.replace(/[#?].*$/,"").replace(/[^/]*$/,"");}
function baseVal(){var b=(document.getElementById("baseUrl").value||"").trim()||folder();return b.replace(/\/?$/,"/");}
function linkFor(s){if(s.id){return baseVal()+"report.html?id="+encodeURIComponent(s.id);}return baseVal()+"report.html?d="+encodeURIComponent(s.b64)+(s.n?("&n="+encodeURIComponent(s.n)):"")+(s.g?("&g="+encodeURIComponent(s.g)):"");}
function render(list){
  var tb=document.getElementById("tbody");tb.innerHTML="";
  list.forEach(function(s,idx){var url=linkFor(s);var tr=document.createElement("tr");
    tr.innerHTML='<td class="nm">'+esc(s.n)+'</td><td class="ce">'+esc(s.g)+'</td><td class="ce"><span class="badge">'+esc(s.t)+'</span></td>'+
      '<td><input class="lk" readonly value="'+esc(url)+'"></td>'+
      '<td class="ce"><button class="mini" data-i="'+idx+'" data-act="copy">복사</button> <button class="mini ghost" data-i="'+idx+'" data-act="open">열기</button></td>';
    tb.appendChild(tr);});
  document.getElementById("cnt").textContent=list.length+"명";window.__list=list;
}
function msg(m){var x=document.getElementById("msg");x.textContent=m;setTimeout(function(){if(x.textContent===m)x.textContent="";},4500);}
function copyText(t,done){try{navigator.clipboard.writeText(t).then(done,function(){try{var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();done();}catch(e){msg("복사 실패 — 링크 칸을 직접 복사하세요.");}});}catch(e){try{var ta2=document.createElement("textarea");ta2.value=t;document.body.appendChild(ta2);ta2.select();document.execCommand("copy");ta2.remove();done();}catch(e2){msg("복사 실패 — 링크 칸을 직접 복사하세요.");}}}
function parseSheet(text){var out=[];text.split(/\r?\n/).forEach(function(line){if(!line.trim())return;var c=line.split("\t");if(c.length<2)return;var b64=c[c.length-1].trim();if(!/^[A-Za-z0-9+/=]+$/.test(b64)||b64.length<40)return;var id="",n,g,t;var c0=(c[0]||"").trim(),c1=(c[1]||"").trim();if(/^r[0-9a-z]{8,}$/i.test(c0)||/^https?:\/\//.test(c1)){id=/^r[0-9a-z]{8,}$/i.test(c0)?c0:"";n=c[3];g=c[4];t=c[2];}else if(c.length>=20){n=c[1];g=c[2];t=c[10];}else{n=c[0];g=c[1];t=c[2];}n=(n||"").trim();if(n==="이름"||n==="시각"||!n)return;out.push({id:id,n:n,g:(g||"").trim(),t:(t||"").trim(),b64:b64});});return out;}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button.mini");if(!b)return;var i=+b.getAttribute("data-i"),act=b.getAttribute("data-act"),s=window.__list[i];if(!s)return;var url=linkFor(s);if(act==="open"){window.open(url,"_blank");}else{copyText(url,function(){msg(s.n+" 학생 링크를 복사했습니다.");});}});
document.getElementById("copyAll").addEventListener("click",function(){if(!window.__list||!window.__list.length){msg("학생이 없습니다.");return;}var t=window.__list.map(function(s){return s.n+" 학생\n"+linkFor(s);}).join("\n\n");copyText(t,function(){msg(window.__list.length+"명 링크를 모두 복사했습니다. 카톡/메일에 붙여넣으세요.");});});
document.getElementById("parseBtn").addEventListener("click",function(){var list=parseSheet(document.getElementById("paste").value);if(!list.length){msg("인식된 학생이 없습니다. 응답원본 칸까지 포함해 붙여넣었는지 확인하세요.");return;}render(list);msg(list.length+"명을 불러왔습니다.");});
document.getElementById("baseUrl").addEventListener("input",function(){if(window.__list)render(window.__list);});
(function init(){
  var f=folder();document.getElementById("baseUrl").value=f;
  var note=document.getElementById("baseNote");
  if(location.protocol==="file:"){note.innerHTML="<b style='color:#9a2828'>지금은 내 컴퓨터에서 연 상태입니다.</b> 학부모님께 보낼 링크가 되려면, 이 페이지를 GitHub Pages 주소에서 열거나 위 칸에 배포 주소(예: https://아이디.github.io/저장소/)를 직접 입력하세요.";}
  else{note.textContent="이 폴더 안에 report.html 이 함께 있어야 합니다. 다른 주소면 위 칸을 고치세요.";}
  render(STUDENTS);
})();
